# =============================================================================
#  HomeLab -- ClusterSecretStore for Vault
#  Auth: Kubernetes method — ESO authenticates using its own ServiceAccount
#  token reviewed against the k8s API, no static Vault token stored anywhere.
#  Vault-side setup (not gitops-managed, Vault has no operator here):
#    vault auth enable kubernetes
#    vault write auth/kubernetes/config kubernetes_host=... kubernetes_ca_cert=...
#      token_reviewer_jwt=...
#    vault policy write eso-reader - <<< 'path "secret/data/homelab/*" { capabilities = ["read"] }'
#    vault write auth/kubernetes/role/external-secrets \
#      bound_service_account_names=external-secrets \
#      bound_service_account_namespaces=external-secrets \
#      policies=eso-reader ttl=1h
#  sync-wave -1: needs the ESO CRDs/controller (-2/0) and its ServiceAccount
#  to exist, but should exist before any ExternalSecret tries to use it.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
