---
# =============================================================================
#  HomeLab -- Workload Automation Namespace
#  Placeholder para Control-M Lab deployment
#  Ver: HomeLab-ControlM-Manual.md para detalles de instalación
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: workload-automation
  labels:
    app.kubernetes.io/managed-by: argocd
    homelab/team: workload-automation
    homelab/component: control-m

---
# ResourceQuota — límites del namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workload-automation-quota
  namespace: workload-automation
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "5"

---
# LimitRange — defaults por pod
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-automation-limits
  namespace: workload-automation
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
